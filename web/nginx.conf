# 動作確認コンソールの配信設定。
#
# 静的ファイルは自分で返し、API は app サービスへ中継する。ブラウザから見ると GUI と API が
# 同一オリジンになるため、CORS の設定が要らず HTTP Basic 認証もそのまま通る。
#
# 入口は2つ:
#   https://local.gekal.cn  … 同梱の証明書を使う（local.gekal.cn は公開DNSで 127.0.0.1 を指す）
#   http://localhost:13000  … 証明書を気にせず開きたいとき用

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/app-locations.conf;

    error_page 404 /404.html;
}

server {
    listen 443 ssl;
    http2 on;
    server_name local.gekal.cn *.local.gekal.cn;

    ssl_certificate     /etc/nginx/certs/local.gekal.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/local.gekal.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/app-locations.conf;

    error_page 404 /404.html;
}
