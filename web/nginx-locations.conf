# HTTP / HTTPS の両方の server ブロックから include する共通のルーティング。
# conf.d/ に置くと http ブロック直下に読み込まれてしまうため、別の場所に置いている。

# ハッシュ付きのビルド成果物は内容が変われば名前も変わるので長期キャッシュしてよい
location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# API とヘルスチェックは Spring Boot へ中継する（Authorization ヘッダはそのまま透過する）
location /api/ {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /actuator/ {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# trailingSlash: true で書き出しているため /path → /path/index.html を引く
location / {
    try_files $uri $uri/ $uri.html /index.html;
}
