plugins {
    id 'java'
    alias(libs.plugins.springframework.boot)
    alias(libs.plugins.dependency.management)
}

group = 'cn.gekal.spring'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation libs.flowable.spring.boot.starter.process

    runtimeOnly libs.postgresql

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly libs.h2
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 動作確認用 GUI（web/ の Next.js 静的書き出し）を app の静的リソースへビルドする。
// Node が必要なため通常の build には組み込まず、GUI を変更したときだけ実行する:
//   ./gradlew app:buildWeb
// 出力先は web/next.config.ts ではなく package.json の build:app スクリプトが決めている。
tasks.register('buildWeb', Exec) {
    description = '動作確認用 GUI (web/) をビルドして app の静的リソースへ出力する'
    group = 'build'
    workingDir = rootProject.file('web')
    commandLine 'sh', '-c', 'npm install && npm run build:app'
}
