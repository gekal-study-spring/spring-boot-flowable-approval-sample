spring:
  application:
    name: expense-approval
  # スキーマは migration モジュール（Flyway）が作成する。接続先は compose.yaml の postgres サービス
  datasource:
    url: jdbc:postgresql://localhost:15432/expense_approval
    username: flowable
    password: secret

flowable:
  # スキーマの作成・更新は Flyway が担当するため、アプリ起動時には一切変更させない
  database-schema-update: false
  # 境界タイマー（リマインド）と非同期 Service Task を動かすために必須
  async-executor-activate: true
  # 履歴からプロセス変数を引くため audit 以上が必要
  history-level: audit
  # 起動時オートデプロイは切る。あれは起動のたびに jar 内の BPMN を配備し直すため、
  # 管理API から入れた新しい版があっても再起動でフローが巻き戻る（重複判定がデプロイ名単位のため
  # 名前の違う配備とは照合されない）。空の DB への初回配備は PackagedProcessDefinitionBootstrap が担う
  check-process-definitions: false
  process:
    definition-cache-limit: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    cn.gekal.spring.approval: INFO
